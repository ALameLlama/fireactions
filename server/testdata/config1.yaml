---
socket_path: /run/fireactions/plugin.sock
socket_group: fireactions
state_dir: /var/lib/fireactions
network:
  resolver_path: /etc/resolv.conf


metrics:
  enabled: true
  address: 127.0.0.1:8081


pools:
- name: fireactions-2vcpu-2gb
  replicas: 1
  image: localhost/fireactions-guest:ubuntu-24.04
  image_pull_policy: IfNotPresent
  firecracker:
    binary_path: firecracker
    kernel_image_path: /var/lib/fireactions/vmlinux
    kernel_args: "console=ttyS0 noapic reboot=k panic=1 pci=off nomodules rw"
    machine_config:
      mem_size_mib: 2048
      vcpu_count: 2
    network_interface:
      in_rate_limiter:
        bandwidth:
          size: 131072000
          refill_time: 1000
          one_time_burst: 262144000
        ops:
          size: 10000
          refill_time: 1000
      out_rate_limiter:
        bandwidth:
          size: 26214400
          refill_time: 1000
    rootfs:
      rate_limiter:
        bandwidth:
          size: 52428800
          refill_time: 1000
        ops:
          size: 2000
          refill_time: 1000
- name: fireactions-2vcpu-4gb
  default_user: ci
  replicas: 1
  image: localhost/fireactions-guest:ubuntu-24.04
  image_pull_policy: Never
  firecracker:
    binary_path: firecracker
    kernel_image_path: /var/lib/fireactions/vmlinux
    kernel_args: "console=ttyS0 noapic reboot=k panic=1 pci=off nomodules rw"
    machine_config:
      mem_size_mib: 4096
      vcpu_count: 2

containerd:
  address: /run/containerd/containerd.sock
  namespace: fireactions
log_level: debug
